name: Feature Request
description: Suggest an idea or enhancement for Cappd
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting an enhancement to Cappd!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Motivation
      description: Is your feature request related to a problem or specific use case?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've evaluated.
